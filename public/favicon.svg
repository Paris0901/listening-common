<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE7A1"/>
      <stop offset="50%" stop-color="#E5B842"/>
      <stop offset="100%" stop-color="#B28723"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#06080D"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="7" y="7" width="114" height="114" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.85"/>
  
  <!-- Inner Delicate Hairline -->
  <rect x="13" y="13" width="102" height="102" rx="17" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Iconic Monogram "LC" -->
  <text x="64" y="81" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Newsreader', Georgia, 'Times New Roman', serif" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="1.5" 
        fill="url(#goldGrad)"
        filter="url(#goldGlow)">LC</text>
        
  <!-- Subtle Cardinal Accent Dots -->
  <circle cx="64" cy="20" r="1.5" fill="#E5B842" opacity="0.6"/>
  <circle cx="64" cy="108" r="1.5" fill="#E5B842" opacity="0.6"/>
</svg>
